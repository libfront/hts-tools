<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>JSON Minifier Logo - Funnel Squeeze</title>
  <defs>
    <!-- Action/Compression Color (Vibrant Red-Orange) -->
    <linearGradient id="compressionColor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" /> <!-- Amber -->
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" /> <!-- Red -->
    </linearGradient>
  </defs>
  
  <!-- Outer Container (Symbolizing the JSON document/application area) -->
  <rect x="25" y="25" width="150" height="150" rx="15" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  
  <!-- Input Side: Wide, verbose lines (Before Minification) -->
  <rect x="50" y="50" width="100" height="8" rx="2" fill="#3B82F6" opacity="0.85"/>
  <rect x="50" y="65" width="100" height="8" rx="2" fill="#3B82F6" opacity="0.85"/>
  <rect x="50" y="80" width="100" height="8" rx="2" fill="#3B82F6" opacity="0.85"/>
  
  <!-- Compression Action: The Funnel/Squeeze Shape -->
  <!-- This trapezoid visually forces the wide data down into a narrow space -->
  <polygon 
    points="50,100 150,100 130,130 70,130" 
    fill="url(#compressionColor)" 
    opacity="0.95"
  />
  
  <!-- Output Side: Single, dense, short line (Minified Code) -->
  <rect x="85" y="145" width="30" height="6" rx="2" fill="#1F2937" />
  
  <!-- JSON Curly Braces (Subtle context markers) -->
  <text x="145" y="45" font-family="Arial, sans-serif" font-size="30" fill="#1E40AF" opacity="0.5">{</text>
  <text x="35" y="165" font-family="Arial, sans-serif" font-size="30" fill="#06B6D4" opacity="0.5">}</text>
  
</svg>
